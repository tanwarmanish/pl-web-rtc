<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop off</title>
    <link href="./styles.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="card">
            <button id="sender">Sender</button>
        </div>
        <div class="card">
            <input placeholder="Enter key" id="receive-key">
            <button id="receive">Receive</button>
        </div>


    </div>

    <div class="container message-container">
        
    </div>
    <div class="container">
        <div class="card-input">
            <input placeholder="Input key" type="number">
            <button id="send-message">Send</button>
        </div>
    </div>

    <template id="message-template">
        <div class="card">
            <div class="card-subtitle sender-name">Hello</div>
            <div class="title message-text">Hello</div>
        </div>
    </template>
</body>
<script src="./main.js" type="module"></script>

</html>
